name: release
# Tag-driven PyPI publishing with trusted publishing (OIDC): no PyPI token is stored in GitHub.
#   rakazo-v0.1.1 → promptli-rakazo 0.1.1 on PyPI (pyproject.toml must carry that version)
# One-time owner setup: pypi.org → Publishing → add a (pending) trusted publisher:
#   project promptli-rakazo, owner promptli-dev, repo promptli-rakazo-plugin,
#   workflow release.yml, environment "pypi".
on:
  push:
    tags: ["rakazo-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#rakazo-v}"
          got=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          [ "$got" = "$want" ] || { echo "pyproject.toml is $got, tag is $want"; exit 1; }
      - run: uv build -o dist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
