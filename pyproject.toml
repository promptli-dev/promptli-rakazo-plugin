[project]
name = "promptli-rakazo"
version = "0.1.1"
description = "Promptli Comms for Rakazo: inbound email, texts and voicemail reach a Rakazo bot over Agent Link"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Promptli" }]
dependencies = [
    "promptli[cli]>=0.2.2,<0.3",
    "promptli-gateway>=0.2.2,<0.3",
    "httpx>=0.27",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://comms.promptli.com"
Repository = "https://github.com/promptli-dev/promptli-rakazo-plugin"

[project.scripts]
promptli-rakazo = "promptli_rakazo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptli_rakazo"]

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.17"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["promptli_rakazo"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["promptli_rakazo", "scripts"]
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
